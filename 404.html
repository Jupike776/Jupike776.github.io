<head>

<style>
  @font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:300 400;font-display:optional;src:url('/fonts/cormorant-garamond-i300.woff2') format('woff2')}
  @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:300 400 600;font-display:optional;src:url('/fonts/cormorant-garamond-n300.woff2') format('woff2')}
  @font-face{font-family:'DM Sans';font-style:normal;font-weight:300 400 500;font-display:optional;src:url('/fonts/dm-sans-n300.woff2') format('woff2')}
</style>
<style>
  :root {
    --blue: #a2d1ec;
    --peach: #ffeee9;
    --dark: #2c2c2c;
    --mid: #6b6b6b;
    --light: #f9f6f4;
    --white: #ffffff;
    --blue-dark: #7bb8d8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; color:var(--dark); background:var(--white); min-height:100vh; display:flex; flex-direction:column; }
  nav { padding:18px 48px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(162,209,236,0.2); }
  .nav-logo { font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:600; color:var(--dark); text-decoration:none; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:80px 24px; background:var(--light); }
  .error-wrap { text-align:center; max-width:480px; }
  .error-code { font-family:'Cormorant Garamond',serif; font-size:clamp(6rem,15vw,10rem); font-weight:300; line-height:1; color:var(--blue); margin-bottom:8px; }
  .error-title { font-family:'Cormorant Garamond',serif; font-size:clamp(1.6rem,3vw,2.2rem); font-weight:300; margin-bottom:16px; }
  .error-title em { font-style:italic; color:var(--blue-dark); }
  .error-desc { font-size:0.95rem; font-weight:300; line-height:1.8; color:var(--mid); margin-bottom:40px; }
  .btn-primary { display:inline-block; background:var(--blue); color:var(--dark); padding:14px 32px; border-radius:4px; font-size:0.85rem; font-weight:500; letter-spacing:0.04em; text-decoration:none; transition:all 0.25s; }
  .btn-primary:hover { background:var(--dark); color:white; transform:translateY(-1px); }
  footer { background:#1a1a1a; padding:24px 48px; display:flex; justify-content:space-between; align-items:center; }
  footer p { font-size:0.76rem; color:rgba(255,255,255,0.35); font-weight:300; }
  footer a { color:rgba(255,255,255,0.35); text-decoration:none; font-size:0.76rem; }
  footer a:hover { color:var(--blue); }
  @media (max-width:600px) {
    nav { padding:14px 20px; }
    footer { padding:20px 24px; flex-direction:column; gap:8px; text-align:center; }
  }
</style>
<script>
  var p = decodeURIComponent(window.location.pathname);
